[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asl-yolo-prototype"
version = "0.1.0"
requires-python = ">=3.10"
description = "Reviewed ASL YOLO11n detection pipeline for Colab and Windows"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
